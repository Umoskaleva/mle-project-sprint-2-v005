db:
  table_name: clean_users_charn

split:
  test_size: 0.2
  random_state: 42
  target_col: target

model:
  type: logistic_regression
  hyperparams:
    max_iter: 1000
    C: 1.0

cv:
  n_splits: 5
  n_jobs: -1
  # Основная метрика для сравнения моделей
  primary_scoring: roc_auc
  # Дополнительные метрики, которые считаем при CV
  metrics:
    - roc_auc
    - f1
    - precision
    - recall
    - neg_log_loss
  # Метрики, которые считаем только на тесте (не в CV)
  test_metrics:
    - confusion_matrix
    - roc_auc
    - f1
    - precision
    - recall
    - logloss